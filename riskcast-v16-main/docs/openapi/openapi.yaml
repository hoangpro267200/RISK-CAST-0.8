          enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED]
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    RiskRunDetailResponse:
      allOf:
        - $ref: '#/components/schemas/RiskRunResponse'
        - type: object
