        decision:
          type: string
          enum: [QUOTE, DECLINE, REQUEST_INFO]
        terms_json:
          type: object
        evidence_bundle_id:
          type: string
          format: uuid
        risk_run_id:
          type: string
          format: uuid
        model_version_id:
          type: string
          format: uuid
        notes:
          type: string

    DecisionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        submission_id:
          type: string
          format: uuid
        decided_by_user_id:
          type: string
          format: uuid
        decision:
          type: string
        terms_json:
          type: object
        notes:
          type: string
        created_at:
          type: string
          format: date-time

    PolicyBindRequest:
      type: object
      required: [submission_id, effective_from, effective_to, policy_number]
      properties:
        submission_id:
          type: string
          format: uuid
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: string
          format: date-time
        policy_number:
          type: string

    PolicyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        policy_number:
          type: string
        submission_id:
          type: string
          format: uuid
        status:
          type: string
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: string
          format: date-time
        policy_hash:
          type: string
        created_at:
          type: string
          format: date-time

    FNOLRequest:
      type: object
      required: [loss_date, loss_description, loss_amount_cents]
      properties:
        loss_date:
          type: string
          format: date-time
        loss_description:
          type: string
        loss_amount_cents:
          type: integer
        location:
          type: string
        reported_by:
          type: string

    ClaimResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
