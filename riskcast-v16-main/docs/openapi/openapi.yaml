        model_hash:
          type: string
        risk_run_id:
          type: string
          format: uuid
        input_hash:
          type: string
        result_hash:
          type: string
        seed:
          type: integer

    VerificationResult:
      type: object
      properties:
        valid:
          type: boolean
        stored_hash:
          type: string
        computed_hash:
          type: string
        verified_at:
          type: string
          format: date-time
        errors:
          type: array
          items:
            type: string

    SubmissionCreateRequest:
      type: object
      required: [risk_assessment_id]
      properties:
        risk_assessment_id:
          type: string
          format: uuid
        risk_run_id:
          type: string
          format: uuid
        evidence_bundle_id:
          type: string
          format: uuid
        requested_coverage_json:
          type: object
        corridor_id:
          type: string
          format: uuid
        product_type:
          type: string

    SubmissionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [DRAFT, SUBMITTED, UNDER_REVIEW, REQUESTED_INFO, QUOTED, BOUND, DECLINED, EXPIRED, CLOSED]
        risk_assessment_id:
          type: string
          format: uuid
        risk_run_id:
          type: string
          format: uuid
        evidence_bundle_id:
          type: string
          format: uuid
        created_by_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DecisionCreateRequest:
      type: object
      required: [decision]
