          type: integer
        records_retained:
          type: integer
        retention_reason:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
        code:
          type: string

  # ===========================================================================
  # Parameters
  # ===========================================================================
  parameters:
    AssessmentId:
      name: assessment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Risk assessment ID
    
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Risk run ID
    
    SubmissionId:
      name: submission_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Underwriting submission ID
    
    PolicyId:
      name: policy_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Policy ID
    
    ClaimId:
      name: claim_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Claim ID
    
    BundleId:
      name: bundle_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Evidence bundle ID
    
    ModelId:
      name: model_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Model version ID

  # ===========================================================================
  # Responses
  # ===========================================================================
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    Unauthorized:
      description: Unauthorized - Invalid or missing JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: array
                items:
                  type: object
                  properties:
                    loc:
                      type: array
                      items:
                        type: string
                    msg:
                      type: string
                    type:
                      type: string

  # ===========================================================================
  # Security
  # ===========================================================================
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from authentication endpoint.
        Include in Authorization header as: `Bearer <token>`

security:
  - BearerAuth: []
