        total_loss_cents:
          type: integer
        period:
          type: object
          properties:
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date

    ModelPerformanceReport:
      type: object
      properties:
        model_version_id:
          type: string
          format: uuid
        accuracy:
          type: number
        precision:
          type: number
        recall:
          type: number
        f1_score:
          type: number
        calibration_error:
          type: number

    DeletionReport:
      type: object
      properties:
