# =============================================================================
# RISKCAST - Development Docker Compose
# =============================================================================

version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: riskcast-api:dev
    container_name: riskcast-api-dev
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://riskcast:riskcast@postgres:5432/riskcast
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=dev-secret-key-not-for-production
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - DEBUG=true
      - TOMORROW_IO_API_KEY=${TOMORROW_IO_API_KEY:-test-key}
      - MARINE_TRAFFIC_API_KEY=${MARINE_TRAFFIC_API_KEY:-test-key}
      - PROJECT44_API_KEY=${PROJECT44_API_KEY:-test-key}
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/.pytest_cache
    depends_on:
      - postgres
      - redis
    networks:
      - riskcast-dev

  postgres:
    image: postgres:15-alpine
    container_name: riskcast-postgres-dev
    environment:
      - POSTGRES_USER=riskcast
      - POSTGRES_PASSWORD=riskcast
      - POSTGRES_DB=riskcast
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - riskcast-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskcast"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: riskcast-redis-dev
    ports:
      - "6379:6379"
    networks:
      - riskcast-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Development tools
  adminer:
    image: adminer:latest
    container_name: riskcast-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DESIGN=nette
    networks:
      - riskcast-dev

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: riskcast-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - riskcast-dev

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: riskcast-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - riskcast-dev

networks:
  riskcast-dev:
    driver: bridge

volumes:
  postgres-dev-data:
    driver: local
