apiVersion: apps/v1
kind: Deployment
metadata:
  name: riskcast-worker
  namespace: riskcast
  labels:
    app: riskcast-worker
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: riskcast-worker
  template:
    metadata:
      labels:
        app: riskcast-worker
        component: worker
    spec:
      serviceAccountName: riskcast-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      
      containers:
        - name: worker
          image: riskcast-api:latest
          imagePullPolicy: Always
          
          command:
            - python
            - -m
            - app.workers
          
          envFrom:
            - configMapRef:
                name: riskcast-config
            - secretRef:
                name: riskcast-secrets
          
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "ps aux | grep -v grep | grep 'app.workers' || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
      
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: riskcast-worker-hpa
  namespace: riskcast
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: riskcast-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
