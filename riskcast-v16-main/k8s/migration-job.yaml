apiVersion: batch/v1
kind: Job
metadata:
  name: riskcast-migrations
  namespace: riskcast
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: riskcast-migrations
        component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: riskcast-api
      containers:
        - name: migrations
          image: riskcast-api:latest
          imagePullPolicy: Always
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: riskcast-config
            - secretRef:
                name: riskcast-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
