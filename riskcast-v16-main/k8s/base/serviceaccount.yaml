# =============================================================================
# RISKCAST Service Accounts
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: riskcast-api
  namespace: riskcast
  labels:
    app.kubernetes.io/name: riskcast-api
    app.kubernetes.io/component: api
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: riskcast-worker
  namespace: riskcast
  labels:
    app.kubernetes.io/name: riskcast-worker
    app.kubernetes.io/component: worker
automountServiceAccountToken: true
---
# =============================================================================
# RBAC for API Service Account
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: riskcast-api-role
  namespace: riskcast
rules:
  # ConfigMaps access for feature flags
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Secrets read access (if needed)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Pod information for health checks
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: riskcast-api-rolebinding
  namespace: riskcast
subjects:
  - kind: ServiceAccount
    name: riskcast-api
    namespace: riskcast
roleRef:
  kind: Role
  name: riskcast-api-role
  apiGroup: rbac.authorization.k8s.io
---
# =============================================================================
# RBAC for Worker Service Account
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: riskcast-worker-role
  namespace: riskcast
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: riskcast-worker-rolebinding
  namespace: riskcast
subjects:
  - kind: ServiceAccount
    name: riskcast-worker
    namespace: riskcast
roleRef:
  kind: Role
  name: riskcast-worker-role
  apiGroup: rbac.authorization.k8s.io
