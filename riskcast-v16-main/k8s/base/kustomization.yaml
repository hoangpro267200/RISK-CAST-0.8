# =============================================================================
# Kustomize Base Configuration
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: riskcast

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

commonLabels:
  app.kubernetes.io/part-of: riskcast-platform
  app.kubernetes.io/managed-by: kustomize

images:
  - name: riskcast-api
    newName: ghcr.io/riskcast/api
    newTag: latest

# Common annotations
commonAnnotations:
  contact: "ops@riskcast.io"
  documentation: "https://docs.riskcast.io"
