# =============================================================================
# RISKCAST Services
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: riskcast-api
  namespace: riskcast
  labels:
    app.kubernetes.io/name: riskcast-api
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: riskcast-api
    app.kubernetes.io/component: api
---
# =============================================================================
# Headless Service for Pod Discovery
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: riskcast-api-headless
  namespace: riskcast
  labels:
    app.kubernetes.io/name: riskcast-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: false
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: riskcast-api
    app.kubernetes.io/component: api
