# =============================================================================
# RISKCAST Secrets (Template - use sealed-secrets or external-secrets in prod)
# =============================================================================
# WARNING: This is a template file. In production, use:
# - Sealed Secrets (bitnami-labs/sealed-secrets)
# - External Secrets Operator (external-secrets/external-secrets)
# - HashiCorp Vault
# - AWS Secrets Manager
# - Google Secret Manager
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: riskcast-secrets
  namespace: riskcast
  labels:
    app.kubernetes.io/name: riskcast
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://user:password@postgres-service:5432/riskcast"
  
  # Redis
  REDIS_URL: "redis://redis-service:6379"
  
  # Application
  SECRET_KEY: "your-secret-key-change-in-production"
  JWT_SECRET_KEY: "your-jwt-secret-key"
  
  # External APIs (placeholder - use external-secrets in production)
  TOMORROW_IO_API_KEY: ""
  MARINE_TRAFFIC_API_KEY: ""
  PROJECT44_API_KEY: ""
  
  # AWS
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  S3_BUCKET: "riskcast-production"
---
