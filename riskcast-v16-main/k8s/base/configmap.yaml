# =============================================================================
# RISKCAST ConfigMap
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: riskcast-config
  namespace: riskcast
  labels:
    app.kubernetes.io/name: riskcast
data:
  # Application settings
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  
  # API settings
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "4"
  
  # Feature flags
  ENABLE_SWAGGER: "false"
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
  
  # Rate limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_PER_MINUTE: "100"
  
  # Cache settings
  CACHE_TTL_SECONDS: "300"
  CACHE_DEFAULT_TIMEOUT: "600"
  
  # External services timeout
  EXTERNAL_TIMEOUT_SECONDS: "30"
  EXTERNAL_RETRY_ATTEMPTS: "3"
  
  # Database connection pool
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"
  DB_POOL_TIMEOUT: "30"
  
  # CORS
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_MAX_AGE: "3600"
