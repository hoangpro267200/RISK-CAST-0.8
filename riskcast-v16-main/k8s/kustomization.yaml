apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: riskcast

resources:
  - namespace.yaml
  - configmap.yaml
  - service-account.yaml
  - mysql-deployment.yaml
  - redis-deployment.yaml
  - migration-job.yaml
  - api-deployment.yaml
  - worker-deployment.yaml
  - ingress.yaml
  - network-policy.yaml

# Common labels
commonLabels:
  app.kubernetes.io/name: riskcast
  app.kubernetes.io/component: api
  app.kubernetes.io/part-of: riskcast
  app.kubernetes.io/managed-by: kustomize

# Common annotations
commonAnnotations:
  app.kubernetes.io/version: "3.0.0"
