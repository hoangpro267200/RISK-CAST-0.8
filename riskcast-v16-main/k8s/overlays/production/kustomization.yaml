# =============================================================================
# Production Overlay
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: riskcast-prod

resources:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: production
  tier: production

# Production-specific patches
patches:
  # Increase API replicas for production
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
    target:
      kind: Deployment
      name: riskcast-api
  
  # Increase API resources for production
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "4Gi"
    target:
      kind: Deployment
      name: riskcast-api
  
  # Increase worker replicas
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: riskcast-worker
  
  # Increase worker resources
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
    target:
      kind: Deployment
      name: riskcast-worker
  
  # Update HPA for production
  - patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 30
    target:
      kind: HorizontalPodAutoscaler
      name: riskcast-api-hpa
  
  # Update worker HPA
  - patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 15
    target:
      kind: HorizontalPodAutoscaler
      name: riskcast-worker-hpa

# Production ConfigMap overrides
configMapGenerator:
  - name: riskcast-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - ENABLE_SWAGGER=false
      - API_WORKERS=8

# Pin to specific production image version
images:
  - name: riskcast-api
    newName: ghcr.io/riskcast/api
    newTag: v1.0.0  # Pin to specific version in production
