# =============================================================================
# ArgoCD Installation
# =============================================================================

# This file contains the commands and configuration for installing ArgoCD

# ===========================================================================
# Installation Commands
# ===========================================================================

# 1. Create namespace
# kubectl create namespace argocd

# 2. Install ArgoCD
# kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

# 3. Expose ArgoCD Server (choose one method)

# Method A: LoadBalancer (for cloud environments)
# kubectl patch svc argocd-server -n argocd -p '{"spec": {"type": "LoadBalancer"}}'

# Method B: Ingress (recommended)
# See ingress.yaml

# Method C: Port Forward (for local development)
# kubectl port-forward svc/argocd-server -n argocd 8080:443

# 4. Get initial admin password
# kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d

# 5. Login with ArgoCD CLI
# argocd login <ARGOCD_SERVER>
# argocd account update-password

---
# ===========================================================================
# ArgoCD ConfigMap (Custom Configuration)
# ===========================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Enable admin user (default: true)
  admin.enabled: "true"
  
  # URL for ArgoCD UI
  url: https://argocd.riskcast.io
  
  # Repository credentials templates
  repository.credentials: |
    - url: https://github.com/riskcast
      usernameSecret:
        name: github-credentials
        key: username
      passwordSecret:
        name: github-credentials
        key: password
  
  # Resource customizations
  resource.customizations: |
    apps/Deployment:
      health.lua: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.updatedReplicas == obj.status.replicas then
            hs.status = "Healthy"
            hs.message = "All replicas are updated"
          else
            hs.status = "Progressing"
            hs.message = "Waiting for rollout to complete"
          end
        else
          hs.status = "Progressing"
          hs.message = "Waiting for deployment to start"
        end
        return hs

---
# ===========================================================================
# ArgoCD RBAC ConfigMap
# ===========================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
data:
  policy.default: role:readonly
  policy.csv: |
    # Admins have full access
    g, admins, role:admin
    
    # Developers can view all apps and sync staging
    p, role:developer, applications, get, */*, allow
    p, role:developer, applications, sync, */staging, allow
    g, developers, role:developer
    
    # CI/CD service account can sync production
    p, role:cicd, applications, sync, */production, allow
    g, cicd-service-account, role:cicd

---
# ===========================================================================
# ArgoCD Notifications ConfigMap
# ===========================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.slack: |
    token: $slack-token
  
  template.app-deployed: |
    message: |
      Application {{.app.metadata.name}} is now running new version.
      See details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}.
  
  template.app-sync-failed: |
    message: |
      Application {{.app.metadata.name}} sync failed.
      See details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}.
  
  template.app-health-degraded: |
    message: |
      Application {{.app.metadata.name}} has degraded health.
      See details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}.
  
  trigger.on-deployed: |
    - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
      send: [app-deployed]
  
  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]
  
  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]

---
# ===========================================================================
# Slack Token Secret (Example)
# ===========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
type: Opaque
stringData:
  slack-token: "xoxb-your-slack-bot-token"
