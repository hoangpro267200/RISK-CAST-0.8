# =============================================================================
# ArgoCD Applications
# =============================================================================

# ===========================================================================
# Production Application
# ===========================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: riskcast-api-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  
  source:
    repoURL: https://github.com/riskcast/riskcast-api.git
    targetRevision: main
    path: k8s/overlays/production
  
  destination:
    server: https://kubernetes.default.svc
    namespace: riskcast-prod
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Health checks
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
  
  # Notifications
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: riskcast-deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: riskcast-alerts
    notifications.argoproj.io/subscribe.on-health-degraded.slack: riskcast-alerts

---
# ===========================================================================
# Staging Application
# ===========================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: riskcast-api-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  
  source:
    repoURL: https://github.com/riskcast/riskcast-api.git
    targetRevision: develop
    path: k8s/overlays/staging
  
  destination:
    server: https://kubernetes.default.svc
    namespace: riskcast-staging
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Health checks
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  
  # Notifications
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: riskcast-staging
    notifications.argoproj.io/subscribe.on-sync-failed.slack: riskcast-alerts

---
# ===========================================================================
# ArgoCD Project (Optional - for multi-tenancy)
# ===========================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: riskcast
  namespace: argocd
spec:
  description: RiskCast API Project
  
  sourceRepos:
    - https://github.com/riskcast/riskcast-api.git
  
  destinations:
    - namespace: riskcast-prod
      server: https://kubernetes.default.svc
    - namespace: riskcast-staging
      server: https://kubernetes.default.svc
    - namespace: riskcast-dev
      server: https://kubernetes.default.svc
  
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
  
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  
  roles:
    - name: developer
      description: Developer role
      policies:
        - p, proj:riskcast:developer, applications, get, riskcast/*, allow
        - p, proj:riskcast:developer, applications, sync, riskcast/*-staging, allow
      groups:
        - developers
    
    - name: admin
      description: Admin role
      policies:
        - p, proj:riskcast:admin, applications, *, riskcast/*, allow
      groups:
        - admins
